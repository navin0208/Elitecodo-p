<section [ngStyle]="{ 'background-color': http.getBackgroundColor() }">
  <div class="g-0 min-vh-100">
    <div class="p-4">
      <p class="title_test">Tests</p>
      <div class="row justify-content-center">
        <div class="col-md-5" id="search_section"></div>
        <div class="col-md-12">
          <div class="row my-3 g-4">
            <div class="col-12">
              <div
                class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-4 justify-content-center"
                id="card_border"
              >
                <div class="col" *ngFor="let testType of testTypes">
                  <div
                    class="card p-4 test-type-card h-100 shadow-sm border-0"
                    [style.borderLeft]="'4px solid ' + testType.color"
                    (click)="openTestCreationModal(testType)"
                  >
                    <div class="card-body d-flex flex-column">
                      <div class="d-flex align-items-center mb-3">
                        <i
                          nz-icon
                          [nzType]="testType.icon"
                          nzTheme="outline"
                          class="me-3 test-icon"
                          [style.color]="testType.color"
                        ></i>
                        <h5 class="card-title mb-0">{{ testType.title }}</h5>
                      </div>
                      <p class="card-text text-muted flex-grow-1">
                        {{ testType.description }}
                      </p>
                      <div class="mt-auto">
                        <button
                          nz-button
                          nzType="primary"
                          nzBlock
                          [ngStyle]="{
                            backgroundColor: testType.color,
                            borderColor: testType.color
                          }"
                        >
                          Create Test
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
