<section [ngStyle]="{ 'background-color': http.getBackgroundColor() }">
  <!-- user-feedback.component.html -->
  <div class="feedback-container">
    <div class="feedback-header">
      <h1 nz-typography>Send Your Query</h1>
      <p nz-typography nzType="secondary">
        We value your feedback to improve our services
      </p>
    </div>

    <div class="feedback-content">
      <form nz-form [formGroup]="feedbackForm" (ngSubmit)="submitFeedback()">
        <!-- Feedback Type Selection -->
        <!-- <div class="type-selection">
                    <nz-radio-group formControlName="type" nzButtonStyle="solid">
                        <ng-container *ngFor="let type of feedbackTypes">
                            <label nz-radio-button [nzValue]="type.value">
                                <i nz-icon [nzType]="type.icon"></i>
                                {{ type.label }}
                            </label>
                        </ng-container>
                    </nz-radio-group>
                </div> -->

        <!-- Main Form Content -->
        <div class="form-content" nz-row [nzGutter]="24">
          <!-- Left Column -->
          <div nz-col [nzXs]="24" [nzMd]="16">
            <!-- Title -->
            <nz-form-item>
              <nz-form-label nzRequired>Title</nz-form-label>
              <nz-form-control
                nzErrorTip="Please enter a title (min. 5 characters)"
              >
                <input
                  nz-input
                  formControlName="title"
                  placeholder="Brief title for your feedback"
                />
              </nz-form-control>
            </nz-form-item>

            <!-- Description -->
            <nz-form-item>
              <nz-form-label nzRequired>Description</nz-form-label>
              <nz-form-control
                nzErrorTip="Please provide detailed description (min. 20 characters)"
              >
                <nz-textarea-count [nzMaxCharacterCount]="1000">
                  <textarea
                    formControlName="description"
                    nz-input
                    [nzAutosize]="{ minRows: 4, maxRows: 8 }"
                    placeholder="Describe your feedback in detail..."
                  ></textarea>
                </nz-textarea-count>
              </nz-form-control>
            </nz-form-item>

            <!-- Attachments -->

            <nz-form-item>
              <div class="row">
                <div class="col-md-3">
                  <nz-form-label>Attachments</nz-form-label>
                </div>

                <div class="col-md-9 form-group">
                  <div class="upload-card">
                    <div class="upload-body" (click)="fileInput.click()">
                      <input
                        type="file"
                        #fileInput
                        formControlName="attachments"
                        (change)="handleFileInput($event, 'attachments')"
                        hidden
                      />

                      <!-- Loader -->
                      <div *ngIf="isLoading" class="upload-loader">
                        <i
                          nz-icon
                          nzType="loading"
                          nzSpin
                          class="loading-icon"
                        ></i>
                        <p class="loading-text">Uploading...</p>
                      </div>

                      <!-- Placeholder -->
                      <div
                        *ngIf="
                          !isLoading && !feedbackForm.get('attachments')?.value
                        "
                        class="upload-placeholder"
                      >
                        <i
                          nz-icon
                          nzType="cloud-upload"
                          class="upload-icon"
                        ></i>
                        <p class="upload-text">
                          Drag & Drop or Click to Upload
                        </p>
                      </div>

                      <!-- Preview -->
                      <div
                        *ngIf="
                          !isLoading && feedbackForm.get('attachments')?.value
                        "
                        class="upload-preview"
                      >
                        <!-- Image Preview -->
                        <img
                          *ngIf="
                            isImage(feedbackForm.get('attachments')?.value)
                          "
                          [src]="feedbackForm.get('attachments')?.value"
                          alt="Preview"
                          class="preview-image"
                        />

                        <!-- File Name for Non-Image Files -->
                        <div
                          *ngIf="
                            !isImage(feedbackForm.get('attachments')?.value)
                          "
                          class="file-name-preview"
                        >
                          <i nz-icon nzType="file-text" class="file-icon"></i>
                          <span>{{ fileName }}</span>
                        </div>
                      </div>
                    </div>
                    <div class="upload-footer">
                      <button
                        type="button"
                        class="btn btn-primary"
                        (click)="fileInput.click()"
                      >
                        Choose File
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </nz-form-item>
          </div>

          <!-- Right Column -->
          <div nz-col [nzXs]="24" [nzMd]="8">
            <!-- Category -->
            <nz-form-item>
              <nz-form-label nzRequired>Category</nz-form-label>
              <nz-form-control nzErrorTip="Please select a category">
                <nz-select
                  formControlName="category"
                  nzPlaceHolder="Select category"
                >
                  <nz-option nzValue="academic" nzLabel="Academic"></nz-option>
                  <nz-option
                    nzValue="administrative"
                    nzLabel="Administrative"
                  ></nz-option>
                  <nz-option
                    nzValue="technical"
                    nzLabel="Technical"
                  ></nz-option>
                  <nz-option nzValue="other" nzLabel="Other"></nz-option>
                </nz-select>
              </nz-form-control>
            </nz-form-item>

            <!-- Priority -->
            <nz-form-item>
              <nz-form-label nzRequired>Priority</nz-form-label>
              <nz-form-control>
                <nz-radio-group formControlName="priority">
                  <label nz-radio-button nzValue="high">
                    <!-- <i nz-icon nzType="arrow-up" nzTheme="outline"></i> -->
                    <span>High</span>
                  </label>
                  <label nz-radio-button nzValue="medium">
                    <!-- <i nz-icon nzType="minus" nzTheme="outline"></i> -->
                    <span>Medium</span>
                  </label>
                  <label nz-radio-button nzValue="low">
                    <!-- <i nz-icon nzType="arrow-down" nzTheme="outline"></i> -->
                    <span>Low</span>
                  </label>
                </nz-radio-group>
              </nz-form-control>
            </nz-form-item>

            <!-- Email -->
            <!-- <nz-form-item>
                            <nz-form-label nzRequired>Email</nz-form-label>
                            <nz-form-control nzErrorTip="Please enter a valid email">
                                <input nz-input formControlName="email" placeholder="Your email address" />
                            </nz-form-control>
                        </nz-form-item> -->

            <!-- Submit Button -->
            <div class="submit-section">
              <button
                nz-button
                nzType="primary"
                [nzLoading]="isSubmitting"
                [disabled]="!feedbackForm.valid"
                class="submit-button"
              >
                <i nz-icon nzType="send"></i>
                Submit Feedback
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
