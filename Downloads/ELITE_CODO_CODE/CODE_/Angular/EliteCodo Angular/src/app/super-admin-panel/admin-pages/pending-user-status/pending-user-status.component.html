<div class="dashboard-container">
    <!-- Header Section -->
    <nz-page-header class="site-page-header mb-4">
        <nz-page-header-title>
            <span class="header-title">Dashboard Overview</span>
        </nz-page-header-title>
    </nz-page-header>

    <!-- Stats Cards Grid -->
    <div class="row g-4 mb-4">
        <div *ngFor="let item of statusData" class="col-12 col-md-6 col-xl-4">
            <nz-card [nzBorderless]="true" class="stats-card h-100" [ngClass]="item.color">
                <!-- Card Header -->
                <div class="card-header-custom d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <span class="icon-Card">
                            <i [class]="item.nzIcon"></i>
                        </span>
                        <h3 class="mb-0">{{item.role}}</h3>
                    </div>

                    <!-- Fixed Dropdown -->
                    <a nz-dropdown [nzDropdownMenu]="menu">
                        <i nz-icon nzType="more" nzTheme="outline"></i>
                    </a>
                    <nz-dropdown-menu #menu="nzDropdownMenu">
                        <ul nz-menu>
                            <li nz-menu-item *ngFor="let action of item.actions">{{action}}</li>
                        </ul>
                    </nz-dropdown-menu>
                </div>

                <!-- Card Content -->
                <div class="card-content mt-4">
                    <div class="row align-items-center">
                        <div class="col-7">
                            <div class="stats-info">
                                <h2 class="mb-1">{{item.totalPendingCount}}</h2>
                                <p class="text-muted mb-0">{{item.message}}</p>
                            </div>
                        </div>
                        <div class="col-5">
                            <nz-progress [nzPercent]="Math.round((item.totalPendingCount / item.total) * 100)"
                                [nzStatus]="item.totalPendingCount > 0 ? 'active' : 'success'" nzType="circle"
                                [nzWidth]="80">
                            </nz-progress>
                        </div>
                    </div>

                    <!-- Status Message - NOW FULLY CLICKABLE -->
                    <div class="status-message mt-4">
                        <nz-tag 
                            [nzColor]="getStatusColor(item)"
                            (click)="navigateToPendingList(item.role)"
                            style="cursor: pointer; display: inline-block; width: 100%; text-align: center; padding: 8px 16px;">
                            <i nz-icon [nzType]="getStatusIcon(item)" nzTheme="outline"></i>
                            {{ getStatusMessage(item) }}
                        </nz-tag>
                    </div>

                </div>

                <!-- Card Footer -->
                <nz-divider></nz-divider>
                <div class="card-footer-custom">
                    <a 
                        [routerLink]='["../pending-user-list"]' 
                        [queryParams]="{ orderby: item.role }" 
                        nz-button
                        nzType="link"
                        (click)="$event.stopPropagation()">
                        View Details
                        <i nz-icon nzType="arrow-right" nzTheme="outline"></i>
                    </a>
                </div>
            </nz-card>
        </div>
    </div>
</div>
