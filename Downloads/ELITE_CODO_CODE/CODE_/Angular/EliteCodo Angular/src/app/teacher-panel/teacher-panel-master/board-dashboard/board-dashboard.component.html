        <div class="dashboard-container" [ngStyle]="{ 'background-color': http.getBackgroundColor() }">
            <div class="dashboard-header">
                <h1>Teacher Dashboard</h1>
                <p>Manage your classes, students, and educational resources in one place</p>
            </div>


            <div class="cards-container">
                <div class="card-item" *ngFor="let card of teacherDashboardCards" (click)="routToBoardDash(card.route)"
                    [ngClass]="{'card-highlighted': card.highlighted}">
                    <div class="card-icon">
                        <img [src]="card.image" [alt]="card.title">
                    </div>
                    <div class="card-content">
                        <h3>{{card.title}}</h3>
                        <p>{{card.description}}</p>
                    </div>
                </div>
            </div>
        </div>
