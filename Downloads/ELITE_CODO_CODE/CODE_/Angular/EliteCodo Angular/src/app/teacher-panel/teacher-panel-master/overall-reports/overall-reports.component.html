<section [ngStyle]="{ 'background-color':http.getBackgroundColor()}">
    <div class="dashboard-container">
        <!-- Header Section -->
        <div class="dashboard-header">
            <h1 class="gradient-text">Results Dashboard</h1>
            <p class="subtitle">Welcome back, Teacher!</p>
        </div>

        <!-- Stats Overview -->
        <div class="quick-stats">
            <div class="stat-card" [@fadeInUp]>
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-content">
                    <h3>{{reportsCount.totalStudent}}</h3>
                    <p>Total Students</p>
                </div>
            </div>
            <div class="stat-card" [@fadeInUp]>
                <div class="stat-icon">
                    <i class="fas fa-file-alt"></i>
                </div>
                <div class="stat-content">
                    <h3>{{reportsCount.activeExams}}</h3>
                    <p>Active Exams</p>
                </div>
            </div>
            <div class="stat-card" [@fadeInUp]>
                <div class="stat-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="stat-content">
                    <h3>{{reportsCount.passRate}}%</h3>
                    <p>Pass Rate</p>
                </div>
            </div>
        </div>

        <!-- Main Options Grid -->
        <div class="options-grid">
            <div class="option-card" *ngFor="let option of resultOptions; let i = index" [@cardAnimation]="'in'"
                [ngStyle]="{'animation-delay': i * 0.1 + 's'}" (click)="navigateToOption(option.route)">
                <div class="card-content">
                    <div class="icon-wrapper" [ngClass]="option.colorClass">
                        <i [class]="'fas ' + option.icon"></i>
                    </div>
                    <h3>{{option.title}}</h3>
                    <p>{{option.description}}</p>
                </div>
                <div class="card-footer">
                    <button mat-flat-button color="primary">
                        View Details
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

</section>
