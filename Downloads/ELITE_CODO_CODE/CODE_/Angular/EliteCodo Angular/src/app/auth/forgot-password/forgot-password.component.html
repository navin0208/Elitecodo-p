<div class="bg-gray-50 min-h-screen flex items-center justify-center p-4 ">
    <div class=" max-w-md">
        <!-- Step 1: Phone Number Input -->
        <div *ngIf="showFirst" class="fade-in">
            <nz-card [nzBorderless]="true" class="shadow-lg rounded-lg">
                <div class="text-center space-y-4">
                    <i nz-icon nzType="lock" nzTheme="outline" class="text-5xl text-blue-500"></i>
                    <h2 class="text-2xl font-bold text-gray-800">Forgot Password?</h2>
                    <p class="text-gray-500">Enter your Register Email to receive an OTP</p>

                    <nz-form-item class="mb-6">
                        <nz-form-control>
                            <nz-input-group [nzPrefix]="prefixPhone">
                                <input nz-input [(ngModel)]="forgotPassModel.email" placeholder="Enter email address"
                                    class="rounded-lg" />
                            </nz-input-group>
                            <ng-template #prefixPhone>
                                <i nz-icon nzType="mail" nzTheme="outline"></i>
                            </ng-template>
                        </nz-form-control>
                    </nz-form-item>

                    <!-- <button nz-button nzType="primary" nzSize="large" class="w-full rounded-lg"
                        (click)="getResetPassword()">
                        Send OTP
                    </button> -->


                    <button nz-button nzType="primary" class="btn btn-primary text-center" (click)="getResetPassword()"
                        [nzLoading]="isLoadingOne">{{ button }}</button>
                </div>
            </nz-card>
        </div>

        <!-- Step 2: OTP Verification -->
        <div *ngIf="showSecond" class="fade-in">
            <nz-card [nzBorderless]="true" class="shadow-lg rounded-lg">
                <div class="text-center space-y-4">
                    <i nz-icon nzType="safety-certificate" nzTheme="outline" class="text-5xl text-blue-500"></i>
                    <h2 class="text-2xl font-bold text-gray-800">Enter OTP</h2>
                    <p class="text-gray-500">We've sent a code to your Email</p>

                    <nz-form-item class="mb-6">
                        <nz-form-control>
                            <nz-input-group [nzPrefix]="prefixOtp">
                                <input nz-input [(ngModel)]="validateOtpModel.otp" placeholder="Enter OTP"
                                    class="rounded-lg" />
                            </nz-input-group>
                            <ng-template #prefixOtp>
                                <i nz-icon nzType="key" nzTheme="outline"></i>
                            </ng-template>
                        </nz-form-control>
                    </nz-form-item>

                    <div class="flex space-x-4">
                        <!-- <button nz-button nzType="default" nzSize="large" class="w-1/2 rounded-lg" (click)="reset()">
                            Back
                        </button> -->
                        <button nz-button nzType="primary" nzSize="large" class="w-1/2 rounded-lg"
                            [nzLoading]="isLoadingTwo" (click)="getOtp()">
                            {{buttonTwo}}
                        </button>

                        <!-- <button nz-button nzType="primary" class="btn btn-primary text-center"
                            (click)="getResetPassword()" [nzLoading]="isLoadingOne">{{ button }}</button> -->
                    </div>
                </div>
            </nz-card>
        </div>

        <!-- Step 3: New Password -->
        <div *ngIf="showThird" class="fade-in">
            <nz-card [nzBorderless]="true" class="shadow-lg rounded-lg">
                <div class="text-center space-y-4">
                    <i nz-icon nzType="check-circle" nzTheme="outline" class="text-5xl text-blue-500"></i>
                    <h2 class="text-2xl font-bold text-gray-800">Create New Password</h2>
                    <p class="text-gray-500">Please enter your new password</p>

                    <nz-form-item>
                        <nz-form-control>
                            <nz-input-group [nzPrefix]="prefixNewPass" [nzSuffix]="suffixNewPass">
                                <input nz-input [type]="newPasswordVisible ? 'text' : 'password'"
                                    (keyup)="newPass($event)" placeholder="New password" class="rounded-lg" />
                            </nz-input-group>
                            <ng-template #prefixNewPass>
                                <i nz-icon nzType="lock" nzTheme="outline"></i>
                            </ng-template>
                            <ng-template #suffixNewPass>
                                <i nz-icon [nzType]="newPasswordVisible ? 'eye' : 'eye-invisible'" nzTheme="outline"
                                    (click)="newPasswordVisible = !newPasswordVisible" style="cursor: pointer;">
                                </i>
                            </ng-template>
                        </nz-form-control>
                    </nz-form-item>

                    <nz-form-item class="mb-6">
                        <nz-form-control>
                            <nz-input-group [nzPrefix]="prefixConfirmPass" [nzSuffix]="suffixConfirmPass">
                                <input nz-input [type]="confirmPasswordVisible ? 'text' : 'password'"
                                    (keyup)="confirmPass($event)" placeholder="Confirm password" class="rounded-lg" />
                            </nz-input-group>
                            <ng-template #prefixConfirmPass>
                                <i nz-icon nzType="lock" nzTheme="outline"></i>
                            </ng-template>
                            <ng-template #suffixConfirmPass>
                                <i nz-icon [nzType]="confirmPasswordVisible ? 'eye' : 'eye-invisible'" nzTheme="outline"
                                    (click)="confirmPasswordVisible = !confirmPasswordVisible" style="cursor: pointer;">
                                </i>
                            </ng-template>
                        </nz-form-control>
                    </nz-form-item>

                    <button nz-button nzType="primary" nzSize="large" [nzLoading]="isLoadingThree"
                        class="w-full rounded-lg" (click)="setNewPassword()">
                        {{buttonThree}}
                    </button>
                </div>
            </nz-card>
        </div>
    </div>
</div>
<div class="area">
    <ul class="circles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</div>
