    <!-- Stats Cards Grid -->
    <div class="stats-grid">
        <div class="stat-card" *ngFor="let stat of userStats" [ngClass]="stat.bgClass">
            <div class="card-content" (click)="navigateTo(stat.title)">
                <div class="stat-header">
                    <div class="stat-title-area">
                        <h3 class="stat-title">{{stat.title|titlecase}}</h3>
                        <!-- <span class="stat-trend" *ngIf="stat.trend">
                            <i
                                [class]="stat.trend > 0 ? 'fas fa-arrow-up trend-up' : 'fas fa-arrow-down trend-down'"></i>
                            <span
                                [ngClass]="stat.trend > 0 ? 'trend-up-text' : 'trend-down-text'">{{stat.trend}}%</span>
                        </span> -->
                    </div>
                    <div class="stat-icon" [ngClass]="stat.colorClass">
                        <i [class]="stat.icon"></i>
                    </div>
                </div>

                <div class="stat-body">
                    <div class="total-count-wrapper">
                        <div class="total-count">{{stat.total | number}}</div>
                        <div class="total-label">Total</div>
                    </div>

                    <div class="status-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" [style.width.%]="(stat.active / stat.total) * 100"></div>
                        </div>
                        <div class="status-counts">
                            <div class="status-item">
                                <span class="status-dot active-dot"></span>
                                <span class="status-label">Active:</span>
                                <span class="status-value">{{stat.active | number}}</span>
                            </div>
                            <div class="status-item">
                                <span class="status-dot inactive-dot"></span>
                                <span class="status-label">Inactive:</span>
                                <span class="status-value">{{stat.inactive | number}}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-footer">
                    <span class="view-details">View Details</span>
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts and Analytics Section -->
    <div class="charts-grid">
        <!-- Tests Generated Chart -->
        <div class="chart-container">
            <div class="chart-header">

                <!-- Header section -->
                <h3>Tests Generated Analytics</h3>

                <!-- Refresh button -->
                <div class="chart-actions">
                    <button class="chart-action-btn">
                        <mat-icon>refresh</mat-icon>
                    </button>
                </div>

            </div>
            <div class="echarts-wrapper" id="testsGeneratedChart"></div>
        </div>
    </div>
