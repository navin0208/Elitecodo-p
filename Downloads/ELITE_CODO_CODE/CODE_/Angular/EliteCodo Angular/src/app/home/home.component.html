<div class="context text-center">
    <img src="../../assets/images/elitecodo.png" class="logo" alt="EliteCodo Logo">

    <h1 class="text-4xl font-bold text-white">Welcome to EliteCodo!</h1>

    <div class="container">
        <div class="row justify-content-center button-row">

            <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12">
                <a class="btn animated-button thar-four" (click)="routeToNext('Super-Admin-Login')">
                    Super-Admin Login
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12">
                <a class="btn animated-button thar-four" (click)="routeToNext('Admin-Login')">
                    Administrator Login
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12">
                <a class="btn animated-button thar-four" (click)="routeToNext('Institution-Login')">
                    Institution Login
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12">
                <a class="btn animated-button thar-four" (click)="routeToNext('Teacher-Login')">
                    Teacher Login
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12">
                <a class="btn animated-button thar-four" (click)="routeToNext('Student-Login')">
                    Student Login
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12">
                <a class="btn animated-button thar-four" (click)="routeToNext('Parent-Login')">
                    Parent Login
                </a>
            </div>

        </div>
    </div>
</div>
